<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Jungle Sim Viewer</title>
<style>
body{font-family:sans-serif;background:#1b2a1b;color:#eee;margin:0;padding:12px}
button,select{font-size:16px}
.tabs button{padding:6px 14px}.tabs button.on{background:#4a8}
.hidden{display:none}
#battle{display:flex;gap:30px;align-items:center;background:#243a24;padding:10px;margin:8px 0;border-radius:6px}
.fighter{text-align:center;min-width:180px}.emo{font-size:48px}
.bar{background:#522;height:14px;border-radius:7px;overflow:hidden}.bar>div{background:#4c4;height:100%}
#log{height:260px;overflow:auto;background:#111;font-family:monospace;font-size:13px;margin-top:8px}
#log div{padding:1px 6px;cursor:pointer;white-space:nowrap}#log div.cur{background:#665500}
#scrub{width:100%}canvas{background:#111;display:block;margin-top:8px;max-width:100%}
.stat{display:inline-block;margin:8px 16px 8px 0;font-size:20px}
</style></head><body>
<div class="tabs"><button id="tab-replay" class="on">Replay</button><button id="tab-dashboard">Dashboard</button></div>
<div id="replay">
 <div><button id="play">Play</button> <select id="speed"><option>1</option><option>4</option><option>16</option><option>64</option></select>x
