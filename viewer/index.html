<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>Jungle Sim Viewer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* Design tokens. See viewer/STYLE.md. */
:root{--accent:#2e7d4f;--accent-fg:#ffffff;--accent-text:#4cb27a;--bg:#0b0c0e;--card:#131518;--card-2:#1b1e23;--border:#2a2e34;--fg:#e8eaed;--muted:#9aa1ab;--good:#4ade80;--bad:#f87171;--warn:#fbbf24;--ring:#60a5fa;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--r-sm:4px;--r-md:8px;--fs-xs:12px;--fs-sm:13px;--fs-md:14px;--fs-lg:18px;--fs-kpi:28px;--icon:16px;--control-h:32px;--shadow-pop:0 8px 24px rgba(0,0,0,.28)}
:root[data-theme="dark"]{--bg:#0b0c0e;--card:#131518;--card-2:#1b1e23;--border:#2a2e34;--fg:#e8eaed;--muted:#9aa1ab;--good:#4ade80;--bad:#f87171;--warn:#fbbf24;--ring:#60a5fa}
:root[data-theme="light"]{--bg:#f6f7f8;--card:#ffffff;--card-2:#eef0f2;--border:#d9dde2;--fg:#16181b;--muted:#5b626b;--good:#15803d;--bad:#b91c1c;--warn:#b45309;--ring:#2563eb}
*{box-sizing:border-box}
html,body{overflow:hidden}
html{height:100%}
body{height:100dvh;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:var(--fs-md);line-height:1.4}
:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
.hidden{display:none}
.panel{background:#1f3324;border:1px solid #2f4a37;border-radius:8px;padding:10px 12px;margin:0 0 12px}
#run-controls{padding:8px 12px}
.bar-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.bar-row label{display:flex;align-items:center;gap:6px;color:#b8cdb8}
#seed{width:11ch}#batch-runs{width:8ch}
.sep{width:1px;height:22px;background:#3a5a42;margin:0 4px}
#run-btn,#batch-btn{background:#2e7d4f;border-color:#3e9b63}#run-btn:hover:not(:disabled),#batch-btn:hover:not(:disabled){background:#38955f}
#run-status{color:#fc6;margin-left:4px}
details#knob-box{margin-top:8px}details summary{cursor:pointer;color:#9fd1a8;user-select:none}
#knobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 18px;margin:8px 0;font-size:13px}
#knobs label{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#b8cdb8}
#knobs input{width:80px;font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{padding:6px 18px;background:transparent;border-color:#2f4a37}.tabs button.on{background:#2e7d4f;border-color:#3e9b63;color:#fff}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:6px}#info{color:#b8cdb8}
#scrub{width:100%;margin:0 0 10px;accent-color:#3e9b63}
#battle{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;margin-bottom:12px}
.fighter{text-align:center;min-width:0}.emo{font-size:44px;line-height:1.1;min-height:50px}
.fighter .bar{max-width:260px;margin:4px auto}
#hmeta,#mhp,#hhp{font-size:13px;color:#cfe0cf}
#zone{font-size:24px;text-align:center}
.bar{background:#4a2222;height:12px;border-radius:6px;overflow:hidden}.bar>div{background:#4c4;height:100%}
#timeline{width:100%;height:140px;background:#101810;border:1px solid #2f4a37;border-radius:6px;display:block;margin-bottom:12px}
#log{position:relative;height:220px;overflow:auto;background:#101810;border:1px solid #2f4a37;border-radius:6px;font:12px/1.5 ui-monospace,Consolas,monospace}
#log div{padding:0 8px;cursor:pointer;white-space:nowrap}#log div:hover{background:#1c2c20}#log div.cur{background:#665500}
#dstats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.stat{background:#1f3324;border:1px solid #2f4a37;border-radius:8px;padding:8px 14px;font-size:16px}
#hist{background:#1f3324;border:1px solid #2f4a37;border-radius:8px;padding:10px 12px}
@media(max-width:700px){#battle{grid-template-columns:1fr 1fr}#zone{grid-column:1/3;order:-1}}
</style></head><body>
<div id="run-controls" class="panel hidden">
 <div class="bar-row"><label>Seed <input id="seed" type="number" min="0" value="1"></label> <button id="run-btn">Run</button> <button id="random-seed">Random seed</button>
 <span class="sep"></span>
 <label>Batch runs <input id="batch-runs" type="number" min="1" max="20000" value="2000"></label> <button id="batch-btn">Run batch</button><span id="run-status"></span></div>
 <details id="knob-box"><summary>Tuning knobs</summary>
 <div id="knobs"></div>
 <button id="knobs-reset">Reset knobs</button></details>
</div>
<div class="tabs"><button id="tab-replay" class="on">Replay</button><button id="tab-dashboard">Dashboard</button></div>
<div id="replay">
 <div class="toolbar"><button id="play">Play</button> <select id="speed"><option>1</option><option>4</option><option>16</option><option>64</option></select>x
 <span id="info"></span></div>
 <input id="scrub" type="range" min="0" max="0" value="0">
 <div id="battle" class="panel"><div class="fighter"><div class="emo">🧙</div><div class="bar"><div id="hbar"></div></div><div id="hhp"></div><div id="hmeta"></div></div>
 <div id="zone"></div>
 <div class="fighter"><div class="emo" id="memo"></div><div class="bar"><div id="mbar"></div></div><div id="mhp"></div></div></div>
 <canvas id="timeline" width="800" height="140"></canvas>
 <div id="log"></div>
</div>
<div id="dashboard" class="hidden">
 <div id="dstats"></div>
 <div id="hist"></div>
</div>
<script src="data/run.js" onerror="void 0"></script>
<script src="data/stats.js" onerror="void 0"></script>
<script>
(function(){
var SP=[["Jungle Rat","🐀"],["Vine Snake","🐍"],["Monkey Thief","🐒"],["Wild Boar","🐗"],["Giant Spider","🕷️"],["Jaguar","🐆"],["Crocodile","🐊"],["Poison Frog","🐸"],["Swamp Troll","🧌"],["Stone Golem","🗿"],["Ruin Wraith","👻"],["Gorilla","🦍"],["Cave Bat","🦇"],["Thunder Raptor","🦖"],["Ancient Serpent","🐉"],["Jungle King","👑"]];
var ZN=[["Base Camp","⛺"],["Jungle Edge","🌿"],["Dense Jungle","🌳"],["River Bank","🏞️"],["Misty Swamp","🌫️"],["Ancient Ruins","🏛️"],["Bat Caves","🕳️"],["Serpent Temple","🛕"],["King's Grove","👑"]];
var $=function(i){return document.getElementById(i)};
var run=window.RUN||null, ev=(run&&run.events)||[], cur=0, timer=null, logFirst=-1, logLast=-1;
function showTab(t){$("replay").className=t==="r"?"":"hidden";$("dashboard").className=t==="d"?"":"hidden";
 $("tab-replay").className=t==="r"?"on":"";$("tab-dashboard").className=t==="d"?"on":"";if(t==="d")dash();}
$("tab-replay").onclick=function(){showTab("r")};$("tab-dashboard").onclick=function(){showTab("d")};
function pct(a,b){return b>0?Math.max(0,Math.min(100,100*a/b)):0}
function render(){
 if(!ev.length){$("info").textContent=" No run data (data/run.js missing)";return;}
 var e=ev[cur],h=e.hero||{},m=e.mon;
 $("scrub").value=cur;
 $("info").textContent=" event "+cur+" / "+(ev.length-1)+"  seed "+run.seed+(run.won?" WON":"");
 $("hbar").style.width=pct(h.hp,h.max_hp)+"%";
 $("hhp").textContent="HP "+h.hp+"/"+h.max_hp;
 $("hmeta").textContent="Lv "+h.level+"  XP "+h.xp+"  Gold "+h.gold+"  Potions "+h.potions;
 var z=ZN[h.zone]||["?",""];$("zone").textContent=z[1]+" "+z[0];
 if(m){var s=SP[m.species]||["?","❓"];$("memo").textContent=s[1];$("mbar").style.width=pct(m.hp,m.max_hp)+"%";
  $("mhp").textContent=s[0]+" Lv "+m.level+"  HP "+m.hp+"/"+m.max_hp;}
 else{$("memo").textContent="";$("mbar").style.width="0";$("mhp").textContent="";}
 var L=$("log");
 if(logFirst<0||cur<logLast||cur>logLast+150){logFirst=Math.max(0,cur-150);logLast=logFirst-1;L.innerHTML="";}
 for(var i=logLast+1;i<=cur;i++){var d=document.createElement("div");d.textContent=i+" ["+ev[i].kind+"] "+ev[i].text;d.dataset.i=String(i);
  d.onclick=function(){cur=+this.dataset.i;render();};L.appendChild(d);}
 logLast=cur;
 var prev=L.querySelector(".cur");if(prev)prev.className="";
 var c=L.children[cur-logFirst];if(c){c.className="cur";L.scrollTop=c.offsetTop-L.clientHeight/2;}
 timeline();
}
function timeline(){
 var cv=$("timeline");if(cv.clientWidth>0&&cv.width!==cv.clientWidth)cv.width=cv.clientWidth;var g=cv.getContext("2d"),W=cv.width,H=cv.height,n=ev.length;
 g.clearRect(0,0,W,H);if(!n)return;
 var mx=1;for(var i=0;i<n;i++)mx=Math.max(mx,ev[i].hero.level);
 g.strokeStyle="#6f6";g.beginPath();
 var step=Math.max(1,Math.floor(n/W));
 for(i=0;i<n;i+=step){var x=i/Math.max(1,n-1)*W,y=H-ev[i].hero.level/mx*(H-10)-2;i?g.lineTo(x,y):g.moveTo(x,y);}
 g.stroke();g.strokeStyle="#fc0";var cx=cur/Math.max(1,n-1)*W;g.beginPath();g.moveTo(cx,0);g.lineTo(cx,H);g.stroke();
 g.fillStyle="#ccc";g.fillText("level (max "+mx+") vs event",4,10);
}
function step(){var sp=+$("speed").value;cur=Math.min(ev.length-1,cur+sp);render();if(cur>=ev.length-1)stop();}
function stop(){clearInterval(timer);timer=null;$("play").textContent="Play";}
$("play").onclick=function(){if(timer)return stop();if(cur>=ev.length-1)cur=0;$("play").textContent="Pause";timer=setInterval(step,100);};
$("scrub").oninput=function(){cur=+this.value;render();};
$("scrub").max=Math.max(0,ev.length-1);
window.__jv={setRun:function(r){run=r;ev=(r&&r.events)||[];cur=0;logFirst=-1;logLast=-1;$("scrub").max=Math.max(0,ev.length-1);render();},
 goto:function(i){cur=i;render();},
 logIndices:function(){var o=[],ch=$("log").children;for(var i=0;i<ch.length;i++)o.push(+ch[i].dataset.i);return o;}};
function dash(){
 var s=window.STATS,D=$("dstats"),H=$("hist");
 if(!s){D.textContent="No stats data (data/stats.js missing)";H.textContent="";return;}
 var wr=s.runs?100*s.wins/s.runs:0,ad=s.avg_deaths,al=s.avg_final_level;
 D.innerHTML="";
 [["Win rate",wr.toFixed(1)+"%"],["Avg deaths",(+ad).toFixed(2)],["Avg final level",(+al).toFixed(1)],["Runs",s.runs]].forEach(function(p){
  var d=document.createElement("span");d.className="stat";d.textContent=p[0]+": "+p[1];D.appendChild(d);});
 var hs=s.level_hist||[],mx=Math.max.apply(null,hs.concat([1]));H.innerHTML="";
 hs.forEach(function(v,l){var r=document.createElement("div");r.style.cssText="display:flex;align-items:center;font-size:12px";
  r.innerHTML='<span style="width:40px;flex:none">L'+l+'</span><div style="background:#4a8;height:12px;width:'+(v/mx*60)+'%"></div>&nbsp;'+v;H.appendChild(r);});
}
var knobList=[];
function setStatus(t){$("run-status").textContent=t||"";}
function setBusy(b){$("run-btn").disabled=b;$("batch-btn").disabled=b;}
function knobQuery(){return knobList.map(function(k){return k.key+"="+encodeURIComponent($("knob-"+k.key).value);}).join("&");}
function api(url,label){
 setBusy(true);setStatus(label);
 return fetch(url).then(function(r){return r.json().then(function(j){
  if(!r.ok)throw new Error((j&&j.error)||("HTTP "+r.status));return j;});})
 .then(function(j){setBusy(false);setStatus("");return j;},
  function(e){setBusy(false);setStatus("Error: "+(e&&e.message||e));return null;});
}
function initControls(cfg){
 knobList=cfg.knobs||[];var K=$("knobs");K.innerHTML="";
 knobList.forEach(function(k){
  var l=document.createElement("label");l.textContent=k.label+" ";
  var i=document.createElement("input");i.type="number";i.id="knob-"+k.key;i.value=String(k.default);
  i.min=String(k.min);i.max=String(k.max);i.step="any";l.appendChild(i);K.appendChild(l);});
 $("run-controls").classList.remove("hidden");
}
$("knobs-reset").onclick=function(){knobList.forEach(function(k){$("knob-"+k.key).value=String(k.default);});};
$("random-seed").onclick=function(){$("seed").value=String(Math.floor(Math.random()*4294967296));};
$("run-btn").onclick=function(){
 var q="/api/run?seed="+encodeURIComponent($("seed").value)+(knobList.length?"&"+knobQuery():"");
 api(q,"Running...").then(function(j){if(j){window.__jv.setRun(j);showTab("r");}});
};
$("batch-btn").onclick=function(){
 var q="/api/batch?runs="+encodeURIComponent($("batch-runs").value)+(knobList.length?"&"+knobQuery():"");
 api(q,"Running batch...").then(function(j){if(j){window.STATS=j;showTab("d");}});
};
if(/^https?:$/.test(location.protocol)){
 fetch("/api/config").then(function(r){return r.ok?r.json():null;}).then(function(c){if(c)initControls(c);},function(){});
}
render();
})();
</script></body></html>
