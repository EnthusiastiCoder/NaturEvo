<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Jungle Sim Viewer</title>
<style>
body{font-family:sans-serif;background:#1b2a1b;color:#eee;margin:0;padding:12px}
button,select{font-size:16px}
.tabs button{padding:6px 14px}.tabs button.on{background:#4a8}
.hidden{display:none}
#battle{display:flex;gap:30px;align-items:center;background:#243a24;padding:10px;margin:8px 0;border-radius:6px}
.fighter{text-align:center;min-width:180px}.emo{font-size:48px}
.bar{background:#522;height:14px;border-radius:7px;overflow:hidden}.bar>div{background:#4c4;height:100%}
#log{position:relative;height:260px;overflow:auto;background:#111;font-family:monospace;font-size:13px;margin-top:8px}
#log div{padding:1px 6px;cursor:pointer;white-space:nowrap}#log div.cur{background:#665500}
#scrub{width:100%}canvas{background:#111;display:block;margin-top:8px;max-width:100%}
.stat{display:inline-block;margin:8px 16px 8px 0;font-size:20px}
#run-controls{background:#243a24;padding:8px;margin:8px 0;border-radius:6px}
#run-controls input{font-size:14px;width:90px}
#knobs{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px;font-size:13px}
#run-status{margin-left:8px;color:#fc6}
</style></head><body>
<div id="run-controls" class="hidden">
 <div>Seed <input id="seed" type="number" min="0" value="1"> <button id="run-btn">Run</button> <button id="random-seed">Random seed</button>
 | Batch runs <input id="batch-runs" type="number" min="1" max="20000" value="2000"> <button id="batch-btn">Run batch</button>
 <button id="knobs-reset">Reset knobs</button><span id="run-status"></span></div>
 <div id="knobs"></div>
</div>
<div class="tabs"><button id="tab-replay" class="on">Replay</button><button id="tab-dashboard">Dashboard</button></div>
<div id="replay">
 <div><button id="play">Play</button> <select id="speed"><option>1</option><option>4</option><option>16</option><option>64</option></select>x
 <span id="info"></span></div>
 <input id="scrub" type="range" min="0" max="0" value="0">
 <div id="battle"><div class="fighter"><div class="emo">🧙</div><div class="bar"><div id="hbar"></div></div><div id="hhp"></div><div id="hmeta"></div></div>
 <div id="zone" style="font-size:28px"></div>
 <div class="fighter"><div class="emo" id="memo"></div><div class="bar"><div id="mbar"></div></div><div id="mhp"></div></div></div>
 <canvas id="timeline" width="800" height="140"></canvas>
 <div id="log"></div>
</div>
<div id="dashboard" class="hidden">
 <div id="dstats"></div>
 <div id="hist"></div>
</div>
<script src="data/run.js" onerror="void 0"></script>
<script src="data/stats.js" onerror="void 0"></script>
<script>
(function(){
var SP=[["Jungle Rat","🐀"],["Vine Snake","🐍"],["Monkey Thief","🐒"],["Wild Boar","🐗"],["Giant Spider","🕷️"],["Jaguar","🐆"],["Crocodile","🐊"],["Poison Frog","🐸"],["Swamp Troll","🧌"],["Stone Golem","🗿"],["Ruin Wraith","👻"],["Gorilla","🦍"],["Cave Bat","🦇"],["Thunder Raptor","🦖"],["Ancient Serpent","🐉"],["Jungle King","👑"]];
var ZN=[["Base Camp","⛺"],["Jungle Edge","🌿"],["Dense Jungle","🌳"],["River Bank","🏞️"],["Misty Swamp","🌫️"],["Ancient Ruins","🏛️"],["Bat Caves","🕳️"],["Serpent Temple","🛕"],["King's Grove","👑"]];
var $=function(i){return document.getElementById(i)};
var run=window.RUN||null, ev=(run&&run.events)||[], cur=0, timer=null, logFirst=-1, logLast=-1;
function showTab(t){$("replay").className=t==="r"?"":"hidden";$("dashboard").className=t==="d"?"":"hidden";
 $("tab-replay").className=t==="r"?"on":"";$("tab-dashboard").className=t==="d"?"on":"";if(t==="d")dash();}
$("tab-replay").onclick=function(){showTab("r")};$("tab-dashboard").onclick=function(){showTab("d")};
function pct(a,b){return b>0?Math.max(0,Math.min(100,100*a/b)):0}
function render(){
 if(!ev.length){$("info").textContent=" No run data (data/run.js missing)";return;}
 var e=ev[cur],h=e.hero||{},m=e.mon;
 $("scrub").value=cur;
 $("info").textContent=" event "+cur+" / "+(ev.length-1)+"  seed "+run.seed+(run.won?" WON":"");
 $("hbar").style.width=pct(h.hp,h.max_hp)+"%";
 $("hhp").textContent="HP "+h.hp+"/"+h.max_hp;
 $("hmeta").textContent="Lv "+h.level+"  XP "+h.xp+"  Gold "+h.gold+"  Potions "+h.potions;
 var z=ZN[h.zone]||["?",""];$("zone").textContent=z[1]+" "+z[0];
 if(m){var s=SP[m.species]||["?","❓"];$("memo").textContent=s[1];$("mbar").style.width=pct(m.hp,m.max_hp)+"%";
  $("mhp").textContent=s[0]+" Lv "+m.level+"  HP "+m.hp+"/"+m.max_hp;}
 else{$("memo").textContent="";$("mbar").style.width="0";$("mhp").textContent="";}
 var L=$("log");
 if(logFirst<0||cur<logLast||cur>logLast+150){logFirst=Math.max(0,cur-150);logLast=logFirst-1;L.innerHTML="";}
 for(var i=logLast+1;i<=cur;i++){var d=document.createElement("div");d.textContent=i+" ["+ev[i].kind+"] "+ev[i].text;d.dataset.i=String(i);
  d.onclick=function(){cur=+this.dataset.i;render();};L.appendChild(d);}
 logLast=cur;
 var prev=L.querySelector(".cur");if(prev)prev.className="";
 var c=L.children[cur-logFirst];if(c){c.className="cur";L.scrollTop=c.offsetTop-L.clientHeight/2;}
 timeline();
}
function timeline(){
 var cv=$("timeline"),g=cv.getContext("2d"),W=cv.width,H=cv.height,n=ev.length;
 g.clearRect(0,0,W,H);if(!n)return;
 var mx=1;for(var i=0;i<n;i++)mx=Math.max(mx,ev[i].hero.level);
 g.strokeStyle="#6f6";g.beginPath();
 var step=Math.max(1,Math.floor(n/W));
 for(i=0;i<n;i+=step){var x=i/Math.max(1,n-1)*W,y=H-ev[i].hero.level/mx*(H-10)-2;i?g.lineTo(x,y):g.moveTo(x,y);}
 g.stroke();g.strokeStyle="#fc0";var cx=cur/Math.max(1,n-1)*W;g.beginPath();g.moveTo(cx,0);g.lineTo(cx,H);g.stroke();
 g.fillStyle="#ccc";g.fillText("level (max "+mx+") vs event",4,10);
}
function step(){var sp=+$("speed").value;cur=Math.min(ev.length-1,cur+sp);render();if(cur>=ev.length-1)stop();}
function stop(){clearInterval(timer);timer=null;$("play").textContent="Play";}
$("play").onclick=function(){if(timer)return stop();if(cur>=ev.length-1)cur=0;$("play").textContent="Pause";timer=setInterval(step,100);};
$("scrub").oninput=function(){cur=+this.value;render();};
$("scrub").max=Math.max(0,ev.length-1);
window.__jv={setRun:function(r){run=r;ev=(r&&r.events)||[];cur=0;logFirst=-1;logLast=-1;$("scrub").max=Math.max(0,ev.length-1);render();},
 goto:function(i){cur=i;render();},
 logIndices:function(){var o=[],ch=$("log").children;for(var i=0;i<ch.length;i++)o.push(+ch[i].dataset.i);return o;}};
function dash(){
 var s=window.STATS,D=$("dstats"),H=$("hist");
 if(!s){D.textContent="No stats data (data/stats.js missing)";H.textContent="";return;}
 var wr=s.runs?100*s.wins/s.runs:0,ad=s.avg_deaths,al=s.avg_final_level;
 D.innerHTML="";
 [["Win rate",wr.toFixed(1)+"%"],["Avg deaths",(+ad).toFixed(2)],["Avg final level",(+al).toFixed(1)],["Runs",s.runs]].forEach(function(p){
  var d=document.createElement("span");d.className="stat";d.textContent=p[0]+": "+p[1];D.appendChild(d);});
 var hs=s.level_hist||[],mx=Math.max.apply(null,hs.concat([1]));H.innerHTML="";
 hs.forEach(function(v,l){var r=document.createElement("div");r.style.cssText="display:flex;align-items:center;font-size:12px";
  r.innerHTML='<span style="width:40px">L'+l+'</span><div style="background:#4a8;height:12px;width:'+(v/mx*400)+'px"></div>&nbsp;'+v;H.appendChild(r);});
}
var knobList=[];
function setStatus(t){$("run-status").textContent=t||"";}
function setBusy(b){$("run-btn").disabled=b;$("batch-btn").disabled=b;}
render();
})();
</script></body></html>
