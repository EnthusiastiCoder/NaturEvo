<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NaturEvo v2 viewer</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
<div id="app">
  <header class="bar">
    <h1>NaturEvo Arena</h1>
    <button id="mode-walk" aria-pressed="true" title="Jungle campaign: hero walks the route, then duels">
      <svg viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>Campaign</button>
    <button id="mode-duel" aria-pressed="false" title="Replay a single arena duel">
      <svg viewBox="0 0 24 24"><path d="m14.5 17.5 6-6M14 6l4 4M3 21l6-6M4 4l9 9M20 4l-9 9"/></svg>Duel</button>
    <select id="fight-select" aria-label="Choose fight" title="Choose which encounter or fight to replay"></select>
    <button id="load" aria-label="Load log files" title="Load run.json or a fight log (.json)">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5-5 5 5M12 5v12"/></svg></button>
    <input id="file" type="file" accept=".json" multiple hidden />
    <span class="spacer"></span>
    <button id="rays" aria-label="Toggle vision overlay" aria-pressed="false" title="Show what the fighters see (V)">
      <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <input id="accent" type="color" aria-label="Accent colour" title="Accent colour" value="#2f9e44" />
    <button id="theme-toggle" aria-label="Toggle light and dark theme" title="Toggle light and dark theme (T)">
      <svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg></button>
    <button id="help" aria-label="About this view" title="What am I looking at? (?)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></button>
  </header>
  <main id="stage">
    <div class="hud"><span class="chip" id="hud-a"></span><span class="chip" id="hud-b"></span></div>
    <aside id="info" hidden role="dialog" aria-label="About this view">
      <h2>Reading the replay</h2>
      <ul>
        <li>Green and red bars: health and stamina above each fighter.</li>
